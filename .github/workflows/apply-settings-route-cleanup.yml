name: Apply Settings Route Cleanup

on:
  push:
    branches:
      - agent/settings-ui-overhaul
    paths:
      - ".github/settings-route-patch.trigger"

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'chore: run settings route patch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/settings-ui-overhaul

      - name: Integrate Live TV and remove legacy shortcuts
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}")
              path.write_text(text.replace(old, new, 1))

          settings = Path("app/src/main/java/com/andreassamitsch/ilauncher/ui/settings/SettingsScreen.kt")
          launcher = Path("app/src/main/java/com/andreassamitsch/ilauncher/ui/LauncherApp.kt")
          preview = Path("app/src/debug/java/com/andreassamitsch/ilauncher/ui/preview/SettingsPreviewActivity.kt")

          replace_once(
              settings,
              '''    Content(\n        title = "Inhalte",\n        subtitle = "Quellen & Kanäle",\n        icon = SettingsIcon.Content,\n    ),\n    Diagnostics(''',
              '''    Content(\n        title = "Inhalte",\n        subtitle = "Quellen & Kanäle",\n        icon = SettingsIcon.Content,\n    ),\n    LiveTv(\n        title = "Live TV",\n        subtitle = "Gigablue & EPG",\n        icon = SettingsIcon.LiveTv,\n    ),\n    Diagnostics(''',
          )
          replace_once(
              settings,
              '''    Setup,\n    Content,\n    Diagnostics,''',
              '''    Setup,\n    Content,\n    LiveTv,\n    Diagnostics,''',
          )
          replace_once(
              settings,
              '''    onSetPreviewChannelVisible: (String, Boolean) -> Unit,\n    onShowAllPreviewChannels: () -> Unit,\n    hasTvListingsPermission:''',
              '''    onSetPreviewChannelVisible: (String, Boolean) -> Unit,\n    onShowAllPreviewChannels: () -> Unit,\n    onOpenLiveTv: () -> Unit,\n    hasTvListingsPermission:''',
          )
          replace_once(
              settings,
              '''                    SettingsCategory.Diagnostics -> SettingsDiagnosticsPane(''',
              '''                    SettingsCategory.LiveTv -> SettingsLiveTvPane(\n                        onOpenLiveTv = onOpenLiveTv,\n                    )\n\n                    SettingsCategory.Diagnostics -> SettingsDiagnosticsPane(''',
          )
          replace_once(
              settings,
              '''                SettingsCategory.Content -> null\n                SettingsCategory.Diagnostics ->''',
              '''                SettingsCategory.Content -> null\n                SettingsCategory.LiveTv -> null\n                SettingsCategory.Diagnostics ->''',
          )
          replace_once(
              settings,
              '''            SettingsIcon.Diagnostics -> {''',
              '''            SettingsIcon.LiveTv -> {\n                drawRect(\n                    color = color,\n                    topLeft = Offset(size.width * 0.12f, size.height * 0.24f),\n                    size = androidx.compose.ui.geometry.Size(size.width * 0.76f, size.height * 0.52f),\n                    style = stroke,\n                )\n                drawLine(\n                    color = color,\n                    start = Offset(size.width * 0.38f, size.height * 0.82f),\n                    end = Offset(size.width * 0.62f, size.height * 0.82f),\n                    strokeWidth = strokeWidth,\n                    cap = StrokeCap.Round,\n                )\n                drawLine(\n                    color = color,\n                    start = Offset(size.width * 0.50f, size.height * 0.76f),\n                    end = Offset(size.width * 0.50f, size.height * 0.82f),\n                    strokeWidth = strokeWidth,\n                    cap = StrokeCap.Round,\n                )\n            }\n\n            SettingsIcon.Diagnostics -> {''',
          )
          replace_once(
              settings,
              '''@Composable\nprivate fun SettingsDiagnosticsPane(''',
              '''@Composable\nprivate fun SettingsLiveTvPane(\n    onOpenLiveTv: () -> Unit,\n) {\n    SettingsContentPane(\n        title = "Live TV",\n        subtitle = "Gigablue, Sender und EPG",\n    ) {\n        SettingsSectionHeader("Receiver")\n        SettingsActionRow(\n            title = "Gigablue & OpenWebif",\n            subtitle = "Verbindung, Bouquets, Sender, EPG und Streams verwalten.",\n            value = "Öffnen",\n            onClick = onOpenLiveTv,\n        )\n        SettingsNotice(\n            text = "Live TV bleibt direkt über OpenWebif angebunden. Die bestehende Live-TV-Seite enthält Verbindung, Senderliste und EPG-Konfiguration.",\n        )\n    }\n}\n\n@Composable\nprivate fun SettingsDiagnosticsPane(''',
          )

          replace_once(
              launcher,
              '''                        TouchButton(\n                            onClick = {\n                                when (val state = updateState) {\n                                    is UpdateState.Available -> updateManager.startDownload(state.info)\n                                    is UpdateState.ReadyToInstall -> scope.launch {\n                                        if (!updateManager.canRequestPackageInstalls()) updateManager.openUnknownSourcesSettings()\n                                        else updateManager.installDownloadedUpdate()\n                                    }\n                                    else -> scope.launch { updateManager.checkForUpdates() }\n                                }\n                            },\n                            enabled = updateState !is UpdateState.Checking && updateState !is UpdateState.Downloading,\n                        ) {\n                            Text(\n                                when (val state = updateState) {\n                                    is UpdateState.Available -> "Update ${state.info.versionName} herunterladen"\n                                    is UpdateState.ReadyToInstall -> "Update ${state.info.versionName} installieren"\n                                    is UpdateState.Downloading -> "Update wird heruntergeladen …"\n                                    UpdateState.Checking -> "Suche nach Update …"\n                                    else -> "Nach Update suchen"\n                                },\n                            )\n                        }\n                        TouchButton(onClick = { section = LauncherSection.LiveTv }) { Text("Live TV / Gigablue") }\n''',
              '',
          )
          replace_once(
              launcher,
              '''                            onSetPreviewChannelVisible = previewChannelPreferences::setVisible,\n                            onShowAllPreviewChannels = previewChannelPreferences::showAll,\n                            hasTvListingsPermission = hasTvListingsPermission,''',
              '''                            onSetPreviewChannelVisible = previewChannelPreferences::setVisible,\n                            onShowAllPreviewChannels = previewChannelPreferences::showAll,\n                            onOpenLiveTv = { section = LauncherSection.LiveTv },\n                            hasTvListingsPermission = hasTvListingsPermission,''',
          )

          replace_once(
              preview,
              '''import androidx.compose.foundation.layout.Arrangement\nimport androidx.compose.foundation.layout.Column\n''',
              '''import androidx.compose.foundation.layout.Column\n''',
          )
          replace_once(
              preview,
              '''import androidx.tv.material3.Text\n''',
              '',
          )
          replace_once(
              preview,
              '''import com.andreassamitsch.ilauncher.ui.components.TouchButton\n''',
              '',
          )
          replace_once(
              preview,
              '''                    Column(\n                        modifier = Modifier\n                            .fillMaxSize()\n                            .padding(start = 24.dp, end = 24.dp, top = 66.dp),\n                        verticalArrangement = Arrangement.spacedBy(10.dp),\n                    ) {\n                        // Keep the two legacy launcher-level shortcuts in this fixture so the\n                        // screenshot represents the actual Settings route, not only SettingsScreen.\n                        TouchButton(onClick = {}) { Text("Nach Update suchen") }\n                        TouchButton(onClick = {}) { Text("Live TV / Gigablue") }\n                        SettingsScreen(''',
              '''                    Column(\n                        modifier = Modifier\n                            .fillMaxSize()\n                            .padding(start = 24.dp, end = 24.dp, top = 66.dp),\n                    ) {\n                        SettingsScreen(''',
          )
          replace_once(
              preview,
              '''                            onSetPreviewChannelVisible = { _, _ -> },\n                            onShowAllPreviewChannels = {},\n                            hasTvListingsPermission = true,''',
              '''                            onSetPreviewChannelVisible = { _, _ -> },\n                            onShowAllPreviewChannels = {},\n                            onOpenLiveTv = {},\n                            hasTvListingsPermission = true,''',
          )

          print("Settings route cleanup applied successfully")
          PY

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/andreassamitsch/ilauncher/ui/LauncherApp.kt \
                  app/src/main/java/com/andreassamitsch/ilauncher/ui/settings/SettingsScreen.kt \
                  app/src/debug/java/com/andreassamitsch/ilauncher/ui/preview/SettingsPreviewActivity.kt
          git diff --cached --check
          git commit -m "fix: integrate live tv into settings navigation"
          git push origin HEAD:agent/settings-ui-overhaul

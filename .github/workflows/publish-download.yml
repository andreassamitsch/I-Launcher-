name: Publish TV Downloader APK

on:
  push:
    branches:
      - agent/phase-1-launcher-mvp
    paths:
      - .github/workflows/publish-download.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-download:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Test and build debug APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk /tmp/I-Launcher-debug.apk

      - name: Publish stable downloader branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan downloader-publish
          git rm -rf .
          cp /tmp/I-Launcher-debug.apk I-Launcher-debug.apk
          printf '%s\n' '# I Launcher TV Download' 'Diese Branch enthält nur die aktuell manuell veröffentlichte Test-APK.' > README.md
          touch .nojekyll
          git add I-Launcher-debug.apk README.md .nojekyll
          git commit -m "chore: publish TV downloader APK"
          git push origin HEAD:downloads --force

name: Publish TV Downloader APK

on:
  push:
    branches:
      - agent/phase-1-launcher-mvp
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/publish-download.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-download:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Define development version
        run: |
          VERSION_CODE=$((26000000 + GITHUB_RUN_NUMBER))
          VERSION_NAME="0.1.0-dev.${GITHUB_RUN_NUMBER}"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"

      - name: Configure stable development signing
        env:
          DEV_KEYSTORE_BASE64: ${{ secrets.IL_DEV_KEYSTORE_BASE64 }}
          DEV_STORE_PASSWORD: ${{ secrets.IL_DEV_STORE_PASSWORD }}
          DEV_KEY_ALIAS: ${{ secrets.IL_DEV_KEY_ALIAS }}
          DEV_KEY_PASSWORD: ${{ secrets.IL_DEV_KEY_PASSWORD }}
        run: |
          if [ -n "$DEV_KEYSTORE_BASE64" ] && \
             [ -n "$DEV_STORE_PASSWORD" ] && \
             [ -n "$DEV_KEY_ALIAS" ] && \
             [ -n "$DEV_KEY_PASSWORD" ]; then
            echo "$DEV_KEYSTORE_BASE64" | base64 --decode > /tmp/i-launcher-development.jks
            echo "IL_SIGNING_STORE_FILE=/tmp/i-launcher-development.jks" >> "$GITHUB_ENV"
            echo "IL_SIGNING_STORE_PASSWORD=$DEV_STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "IL_SIGNING_KEY_ALIAS=$DEV_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "IL_SIGNING_KEY_PASSWORD=$DEV_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "UPDATE_COMPATIBLE=true" >> "$GITHUB_ENV"
          else
            echo "UPDATE_COMPATIBLE=false" >> "$GITHUB_ENV"
            echo "Stable development signing secrets are not configured; APK will be published for manual installation only."
          fi

      - name: Test and build debug APK
        run: |
          gradle :app:testDebugUnitTest :app:assembleDebug \
            -PiLauncherVersionCode="$VERSION_CODE" \
            -PiLauncherVersionName="$VERSION_NAME" \
            --stacktrace

      - name: Prepare APK and update manifest
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/I-Launcher-debug.apk
          SHA256=$(sha256sum /tmp/I-Launcher-debug.apk | awk '{print $1}')
          cat > /tmp/update.json <<EOF
          {
            "versionCode": $VERSION_CODE,
            "versionName": "$VERSION_NAME",
            "apkUrl": "https://raw.githubusercontent.com/andreassamitsch/I-Launcher-/downloads/I-Launcher-debug.apk",
            "sha256": "$SHA256",
            "updateCompatible": $UPDATE_COMPATIBLE,
            "sourceSha": "$GITHUB_SHA"
          }
          EOF

      - name: Publish stable downloader branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan downloader-publish
          git rm -rf .
          cp /tmp/I-Launcher-debug.apk I-Launcher-debug.apk
          cp /tmp/update.json update.json
          printf '%s\n' \
            '# I Launcher TV Download' \
            'Diese Branch enthält die aktuelle Development-APK und das Update-Manifest für den In-App-Updater.' \
            '' \
            'Direktdownload: https://raw.githubusercontent.com/andreassamitsch/I-Launcher-/downloads/I-Launcher-debug.apk' \
            'Update-Manifest: https://raw.githubusercontent.com/andreassamitsch/I-Launcher-/downloads/update.json' \
            > README.md
          touch .nojekyll
          git add I-Launcher-debug.apk update.json README.md .nojekyll
          git commit -m "chore: publish I Launcher $VERSION_NAME"
          git push origin HEAD:downloads --force

name: Patch ServusTV subtitle default

on:
  push:
    branches:
      - feat/servustv-news-provider-prototype
    paths:
      - .github/workflows/patch-servustv-subtitles.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/servustv-news-provider-prototype
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"
      - name: Patch subtitle behavior
        shell: bash
        run: |
          FILE='servustv-provider/src/main/java/com/andreassamitsch/servusprovider/ui/PlaybackActivity.kt'
          python3 -c 'from pathlib import Path; p=Path("'"$FILE"'"); s=p.read_text(); old="    private var selectedAudioSummary = \"wird ermittelt\"\n    private var userSeeking = false\n"; new="    private var selectedAudioSummary = \"wird ermittelt\"\n    private var subtitlesEnabled = false\n    private var trackSelector: DefaultTrackSelector? = null\n    private var userSeeking = false\n"; assert old in s; p.write_text(s.replace(old,new,1))'
          python3 -c 'from pathlib import Path; p=Path("'"$FILE"'"); s=p.read_text(); old="        val trackSelector = DefaultTrackSelector(this).apply {\n            setParameters(\n                buildUponParameters()\n                    .setForceHighestSupportedBitrate(true)\n                    .setTunnelingEnabled(true),\n            )\n        }\n        player = ExoPlayer.Builder(this)\n            .setMediaSourceFactory(mediaSourceFactory)\n            .setTrackSelector(trackSelector)\n"; new="        val selector = DefaultTrackSelector(this).apply {\n            setParameters(\n                buildUponParameters()\n                    .setForceHighestSupportedBitrate(true)\n                    .setTunnelingEnabled(true)\n                    .setTrackTypeDisabled(C.TRACK_TYPE_TEXT, true),\n            )\n        }\n        trackSelector = selector\n        subtitlesEnabled = false\n        player = ExoPlayer.Builder(this)\n            .setMediaSourceFactory(mediaSourceFactory)\n            .setTrackSelector(selector)\n"; assert old in s; p.write_text(s.replace(old,new,1))'
          python3 -c 'from pathlib import Path; p=Path("'"$FILE"'"); s=p.read_text(); old="        val closeButton = Button(this).apply {\n            text = \"Schließen\"\n            isAllCaps = false\n            setOnClickListener { dialog.dismiss() }\n        }\n        panel.addView(closeButton)\n"; new="        val subtitleButton = Button(this).apply {\n            text = subtitleButtonLabel()\n            isAllCaps = false\n            setOnClickListener {\n                setSubtitlesEnabled(!subtitlesEnabled)\n                text = subtitleButtonLabel()\n            }\n        }\n        panel.addView(subtitleButton)\n        val closeButton = Button(this).apply {\n            text = \"Schließen\"\n            isAllCaps = false\n            setOnClickListener { dialog.dismiss() }\n        }\n        panel.addView(closeButton)\n"; assert old in s; p.write_text(s.replace(old,new,1))'
          python3 -c 'from pathlib import Path; p=Path("'"$FILE"'"); s=p.read_text(); old="    private fun logSelectedTracks(tracks: Tracks) {\n"; new="    private fun subtitleButtonLabel(): String =\n        if (subtitlesEnabled) \"Untertitel: Ein\" else \"Untertitel: Aus\"\n\n    private fun setSubtitlesEnabled(enabled: Boolean) {\n        subtitlesEnabled = enabled\n        val selector = trackSelector ?: return\n        selector.setParameters(\n            selector.buildUponParameters()\n                .setTrackTypeDisabled(C.TRACK_TYPE_TEXT, !enabled),\n        )\n    }\n\n    private fun logSelectedTracks(tracks: Tracks) {\n"; assert old in s; p.write_text(s.replace(old,new,1))'
          python3 -c 'from pathlib import Path; p=Path("'"$FILE"'"); s=p.read_text(); old="        player?.release()\n        player = null\n    }\n"; new="        player?.release()\n        player = null\n        trackSelector = null\n        subtitlesEnabled = false\n    }\n"; assert old in s; p.write_text(s.replace(old,new,1))'
      - name: Test and build launcher and ServusTV
        run: gradle :app:testDebugUnitTest :app:assembleDebug :servustv-provider:testDebugUnitTest :servustv-provider:assembleDebug --stacktrace
      - name: Commit tested change
        run: |
          rm .github/workflows/patch-servustv-subtitles.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(servustv): keep subtitles off by default"
          git push origin HEAD:feat/servustv-news-provider-prototype

name: Apply one-time Joyn Watch Next episode metadata repair
on:
  push:
    paths:
      - .github/workflows/apply-joyn-watchnext-episode-metadata.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/joyn-tv-client
          persist-credentials: true
      - name: Apply checked metadata and artwork changes
        shell: bash
        run: |
          python3 scripts/apply_joyn_watchnext_episode_metadata.py
      - name: Commit repair and remove one-time migration files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-joyn-watchnext-episode-metadata.yml scripts/apply_joyn_watchnext_episode_metadata.py
          git add joyntv/src/main/java/com/andreassamitsch/joyntv/JoynContinueWatching.kt joyntv/src/main/java/com/andreassamitsch/joyntv/JoynResumeMediaMerger.kt joyntv/src/main/java/com/andreassamitsch/joyntv/JoynApiClient.kt joyntv/src/test/java/com/andreassamitsch/joyntv/JoynResumeMediaMergerTest.kt app/src/main/java/com/andreassamitsch/ilauncher/data/tv/WatchNextMediaMapper.kt docs/JOYNTV_CURRENT_STATE.md
          git diff --cached --check
          git commit -m 'fix: preserve Joyn Watch Next episode metadata and artwork'
          git push origin HEAD:feature/joyn-tv-client
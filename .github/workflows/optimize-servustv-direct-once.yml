name: Optimize ServusTV direct news once
on:
  push:
    branches: [fix/servustv-progressive-refresh]
    paths: [.github/workflows/optimize-servustv-direct-once.yml]
permissions:
  contents: write
jobs:
  direct-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/servustv-progressive-refresh
          persist-credentials: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Apply verified direct discovery with fallback
        run: python3 tools/servustv_direct_discovery_patch.py
      - name: Run tests and build ServusTV and I Launcher
        run: gradle :servustv-provider:testDebugUnitTest :servustv-provider:assembleDebug :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Commit tested sources and remove one-off probes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/optimize-servustv-direct-once.yml .github/workflows/probe-servustv-direct-content-once.yml tools/servustv_direct_discovery_patch.py
          git add servustv-provider .github/workflows/optimize-servustv-direct-once.yml .github/workflows/probe-servustv-direct-content-once.yml tools/servustv_direct_discovery_patch.py
          git commit -m 'perf(servustv): refresh verified show collections directly with search fallback'
          git push origin HEAD:fix/servustv-progressive-refresh

name: Apply lean artifact policy

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/optimize-artifact-uploads.yml"

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update artifact upload policy
        shell: python
        run: |
          from pathlib import Path

          smoke_files = {
              Path('.github/workflows/tv-visual-smoke.yml'): 'Upload TV visual smoke screenshots',
              Path('.github/workflows/settings-touch-smoke.yml'): 'Upload phone settings screenshots',
              Path('.github/workflows/tv-discovery-visual-smoke.yml'): 'Upload TV discovery visual smoke screenshots',
          }

          for path, step_name in smoke_files.items():
              text = path.read_text(encoding='utf-8')
              old = f'      - name: {step_name}\n        if: always()\n'
              new = f'      - name: {step_name}\n        if: failure()\n'
              if old not in text and new not in text:
                  raise SystemExit(f'Expected upload step not found in {path}')
              text = text.replace(old, new, 1)
              marker = '          if-no-files-found: warn\n'
              if '          retention-days: 1\n' not in text:
                  if marker not in text:
                      raise SystemExit(f'if-no-files-found marker missing in {path}')
                  text = text.replace(marker, marker + '          retention-days: 1\n', 1)
              path.write_text(text, encoding='utf-8')

          bridge = Path('.github/workflows/cloudstream-bridge.yml')
          text = bridge.read_text(encoding='utf-8')
          text = text.replace('          retention-days: 14\n', '          retention-days: 1\n', 1)
          bridge.write_text(text, encoding='utf-8')

      - name: Commit optimized policy
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/tv-visual-smoke.yml \
            .github/workflows/settings-touch-smoke.yml \
            .github/workflows/tv-discovery-visual-smoke.yml \
            .github/workflows/cloudstream-bridge.yml
          if git diff --cached --quiet; then
            echo "Artifact upload policy already optimized."
            exit 0
          fi
          git commit -m "ci: keep failure diagnostics only and shorten artifact retention [skip ci]"
          git push origin HEAD:main

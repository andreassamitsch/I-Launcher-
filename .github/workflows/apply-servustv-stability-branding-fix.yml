name: Apply ServusTV stability branding fix

on:
  push:
    branches:
      - feat/servustv-news-provider-prototype
    paths:
      - .github/workflows/apply-servustv-stability-branding-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/servustv-news-provider-prototype
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Apply branding changes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('servustv-provider/src/main/java/com/andreassamitsch/servusprovider/data/ServusCatalogPolicy.kt')
          s = p.read_text()
          needle = "    fun titleTreatment(id: String, resources: List<String>): String? {\n        val resource = resources.firstOrNull { name ->\n"
          replacement = (
              "    fun titleTreatment(id: String, resources: List<String>): String? {\n"
              "        if (id == NEWS_90_SECONDS_SHOW_ID) {\n"
              "            val displayArt = resources.firstOrNull { name ->\n"
              "                name.equals(\"rbtv_display_art_landscape\", ignoreCase = true)\n"
              "            }\n"
              "            if (displayArt != null) {\n"
              "                return \"${ServusNetwork.ARTWORK_BASE_URL}$id/$displayArt/f_webp,c_fill,w_640,q_80?namespace=stv&refresh=true\"\n"
              "            }\n"
              "        }\n"
              "        val resource = resources.firstOrNull { name ->\n"
          )
          if needle not in s:
              raise SystemExit('titleTreatment anchor not found')
          s = s.replace(needle, replacement, 1)
          marker = "    private const val MAX_SHOW_EPISODES = 18\n"
          if marker not in s:
              raise SystemExit('catalog constant anchor not found')
          s = s.replace(marker, "    const val NEWS_90_SECONDS_SHOW_ID = \"AAYGF2URW6ALQYE42IJK\"\n" + marker, 1)
          p.write_text(s)

          p = Path('servustv-provider/src/main/java/com/andreassamitsch/servusprovider/data/ServusCurrentChannelSelectionStore.kt')
          s = p.read_text()
          old = (
              "            ServusContentKind.NEWS_90_SECONDS -> {\n"
              "                val dedicated90Shows = allShows.filter { normalize(it.title).contains(\"90 sekunden\") }\n"
              "                if (dedicated90Shows.isNotEmpty()) {\n"
              "                    selectedShows.firstOrNull { normalize(it.title).contains(\"90 sekunden\") }\n"
              "                } else {\n"
              "                    selectedShows.firstOrNull { normalize(it.title).contains(\"servus nachrichten\") }\n"
              "                }\n"
              "            }\n"
          )
          new = (
              "            ServusContentKind.NEWS_90_SECONDS -> {\n"
              "                selectedShows.firstOrNull { it.id == ServusCatalogPolicy.NEWS_90_SECONDS_SHOW_ID }\n"
              "                    ?: run {\n"
              "                        val dedicated90Shows = allShows.filter { normalize(it.title).contains(\"90 sekunden\") }\n"
              "                        if (dedicated90Shows.isNotEmpty()) {\n"
              "                            selectedShows.firstOrNull { normalize(it.title).contains(\"90 sekunden\") }\n"
              "                        } else {\n"
              "                            selectedShows.firstOrNull { normalize(it.title).contains(\"servus nachrichten\") }\n"
              "                        }\n"
              "                    }\n"
              "            }\n"
          )
          if old not in s:
              raise SystemExit('90-second selection anchor not found')
          p.write_text(s.replace(old, new, 1))

          p = Path('servustv-provider/src/test/java/com/andreassamitsch/servusprovider/data/ServusCatalogPolicyTest.kt')
          s = p.read_text()
          anchor = "    @Test\n    fun unrelatedNewsCardIsNotAttachedToServusWetter() {\n"
          test = (
              "    @Test\n"
              "    fun ninetySecondNewsUsesItsOwnDisplayArt() {\n"
              "        val uri = ServusCatalogPolicy.titleTreatment(\n"
              "            ServusCatalogPolicy.NEWS_90_SECONDS_SHOW_ID,\n"
              "            listOf(\"rbtv_background_landscape\", \"rbtv_display_art_landscape\"),\n"
              "        )\n"
              "        assertNotNull(uri)\n"
              "        assertTrue(uri!!.contains(\"AAYGF2URW6ALQYE42IJK/rbtv_display_art_landscape\"))\n"
              "        assertTrue(uri.contains(\"w_640\"))\n"
              "    }\n\n"
          )
          if anchor not in s:
              raise SystemExit('test anchor not found')
          p.write_text(s.replace(anchor, test + anchor, 1))
          PY
      - name: Test and build both apps
        run: gradle :servustv-provider:testDebugUnitTest :servustv-provider:assembleDebug :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Commit tested changes
        run: |
          rm -f .github/workflows/fix-servustv-tv-stability-branding.yml
          rm -f .github/workflows/apply-servustv-stability-branding-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app servustv-provider .github/workflows
          git commit -m "fix(servustv): improve TV stability and show branding"
          git push origin HEAD:feat/servustv-news-provider-prototype

name: Android CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Test and build debug APKs
        run: >-
          gradle
          :app:testDebugUnitTest
          :app:assembleDebug
          :servustv-provider:testDebugUnitTest
          :servustv-provider:assembleDebug
          --stacktrace

      - name: Upload I Launcher debug APK
        uses: actions/upload-artifact@v4
        with:
          name: I-Launcher-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Servus provider prototype APK
        uses: actions/upload-artifact@v4
        with:
          name: Servus-News-Provider-debug
          path: servustv-provider/build/outputs/apk/debug/servustv-provider-debug.apk
          if-no-files-found: error

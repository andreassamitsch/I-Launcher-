name: Apply ServusTV demand refresh update

on:
  push:
    branches:
      - feat/servustv-news-provider-prototype
    paths:
      - .github/workflows/apply-servustv-demand-refresh.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/servustv-news-provider-prototype
          fetch-depth: 0

      - name: Apply ServusTV data and UX changes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Expected block not found in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          data_dir = Path("servustv-provider/src/main/java/com/andreassamitsch/servusprovider/data")
          ui_dir = Path("servustv-provider/src/main/java/com/andreassamitsch/servusprovider/ui")
          res_dir = Path("servustv-provider/src/main/res/drawable")
          test_dir = Path("servustv-provider/src/test/java/com/andreassamitsch/servusprovider/data")
          res_dir.mkdir(parents=True, exist_ok=True)

          # ------------------------------------------------------------------
          # Selection + pure refresh policy

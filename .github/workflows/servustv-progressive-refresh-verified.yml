name: ServusTV progressive refresh verified

on:
  push:
    branches: [fix/servustv-progressive-refresh]
    paths: ['.github/workflows/servustv-progressive-refresh-verified.yml']

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/servustv-progressive-refresh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Patch exact source blocks and preserve remote focus
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          original = Path('.github/workflows/servustv-progressive-refresh.yml').read_text()
          start = original.index("          python3 - <<'PY'\n") + len("          python3 - <<'PY'\n")
          end = original.index('\n          PY', start)
          script = dedent(original[start:end])
          script = script[:script.index("\nreplace_once('''            categories.sortedBy")]
          exec(compile(script, 'source-verified-servustv-patch', 'exec'))

          replace_once('''        }
              }

              private fun addSectionTitle''', '''        }
                  if (focusedContentId != null &&
                      contentContainer.findViewWithTag<View>(focusedContentId)?.requestFocus() != true
                  ) {
                      refreshButton.requestFocus()
                  }
              }

              private fun addSectionTitle''')
          replace_once('''        onClick = { openPlayback(episode.id) },
              )

              private fun buildLiveCard''', '''        onClick = { openPlayback(episode.id) },
              ).apply { tag = episode.id }

              private fun buildLiveCard''')
          replace_once('''            onClick = { openPlayback(channel.id) },
                  )
              }

              private fun buildShowCard''', '''            onClick = { openPlayback(channel.id) },
                  ).apply { tag = channel.id }
              }

              private fun buildShowCard''')
          replace_once('''            onClick = { openShow(show.id) },
                  )
              }

              private fun buildMediaCard''', '''            onClick = { openShow(show.id) },
                  ).apply { tag = show.id }
              }

              private fun buildMediaCard''')
          path.write_text(text)
          print('Source patched; early content notification, changed-data rendering, focus restoration.')
          PY
      - name: Build and test both Android modules
        run: gradle :servustv-provider:testDebugUnitTest :servustv-provider:assembleDebug :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Commit only tested production code
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/servustv-progressive-refresh.yml .github/workflows/servustv-progressive-refresh-retry.yml .github/workflows/servustv-progressive-refresh-verified.yml
          git add servustv-provider/src/main/java/com/andreassamitsch/servusprovider/ui/MainActivity.kt
          git commit -m 'fix(servustv): render saved updates promptly without losing TV focus'
          git push origin HEAD:fix/servustv-progressive-refresh

name: Joyn TV

on:
  pull_request:
    paths:
      - "joyntv/**"
      - "settings.gradle.kts"
      - ".github/workflows/joyn-tv.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and debug APK
        run: gradle :joyntv:testDebugUnitTest :joyntv:assembleDebug

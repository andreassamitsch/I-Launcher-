name: Probe ServusTV direct content once
on:
  push:
    branches: [fix/servustv-progressive-refresh]
    paths: [.github/workflows/probe-servustv-direct-content-once.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect public news and Wegscheider collection metadata
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.request
          headers={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; WOW64; rv:153.0) Gecko/20100101 Firefox/153.0','Accept':'application/json, text/plain, */*','Accept-Language':'de-DE,de;q=0.9,en;q=0.8','Origin':'https://www.servustv.com','Referer':'https://www.servustv.com/'}
          for market in ('at','de'):
            for root in ('AA-1Y5RJCD1H2111','AA-1Q66UK71N1W11'):
              base=f'https://tv-api.redbull.com/'
              def fetch(route):
                req=urllib.request.Request(base+route,headers=headers)
                with urllib.request.urlopen(req,timeout=20) as res: return json.load(res)
              product=fetch(f'products/v5.3/stv/de/{market}/{root}')
              print('ROOT',market,root,product.get('title'),'refs',len(product.get('collections') or []))
              for ref in (product.get('collections') or [])[:8]:
                cid=ref.get('id')
                if not cid: continue
                response=fetch(f'collections/v5.3/stv/de/{market}/{cid}?offset=0')
                cards=response.get('cards') or []
                print('COLLECTION',cid,'name',response.get('label'),'type',response.get('type'),'listType',response.get('list_type'),'n',len(cards),'more',bool((response.get('meta') or {}).get('next')))
                for card in cards[:2]: print('VIDEO',card.get('id'),card.get('title'),card.get('content_type'))
          PY

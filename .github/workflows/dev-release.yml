name: Publish Development APK

on:
  push:
    branches:
      - agent/phase-1-launcher-mvp

permissions:
  contents: write

jobs:
  publish-dev-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Test and build debug APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Prepare stable development filename
        run: cp app/build/outputs/apk/debug/app-debug.apk I-Launcher-debug.apk

      - name: Replace development release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete dev --cleanup-tag --yes || true
          gh release create dev I-Launcher-debug.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "I Launcher Development" \
            --notes "Automatisch erzeugte Testversion aus agent/phase-1-launcher-mvp. Nicht als finaler Release gedacht."

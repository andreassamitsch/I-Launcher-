name: Fix CloudStream episode import once
on:
  push:
    paths:
      - .github/workflows/fix-cloudstream-episode-once.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cloudstream-direct-play
          persist-credentials: true
      - name: Apply verified cache import and future-episode fixes
        run: python3 scripts/fix_cloudstream_episode_getkey_once.py
      - name: Commit source-only modifications
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/cloudstream-bridge/ILauncherNextEpisodeMonitor.kt tools/cloudstream-bridge/apply_next_episode_monitor.py
          git diff --cached --check
          git commit -m 'fix: preserve upcoming CloudStream episodes and correct cache import'
          git push origin HEAD:agent/cloudstream-direct-play
name: Fix ServusTV current logos

on:
  push:
    branches:
      - feat/servustv-news-provider-prototype
    paths:
      - ".github/workflows/fix-servustv-current-logos.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/servustv-news-provider-prototype
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"
      - name: Apply logo metadata fix
        run: |
          echo ' ' | base64 -d | python3
      - name: Test and build
        run: gradle :servustv-provider:testDebugUnitTest :servustv-provider:assembleDebug :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Commit tested fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-servustv-current-logos.yml
          git add servustv-provider/src/main/java/com/andreassamitsch/servusprovider/data/ServusNewsRepository.kt
          git add servustv-provider/src/main/java/com/andreassamitsch/servusprovider/data/ServusCurrentShowMetadataPolicy.kt
          git add servustv-provider/src/test/java/com/andreassamitsch/servusprovider/data/ServusCurrentShowMetadataPolicyTest.kt
          git commit -m "fix(servustv): publish current show logos"
          git push origin HEAD:feat/servustv-news-provider-prototype
name: Diagnose I Launcher Signing Keystore

on:
  push:
    branches:
      - diag/signing-keystore-inspection
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-keystore:
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Inspect signing keystore metadata
        env:
          DEV_KEYSTORE_BASE64: ${{ secrets.IL_DEV_KEYSTORE_BASE64 }}
          DEV_STORE_PASSWORD: ${{ secrets.IL_DEV_STORE_PASSWORD }}
          DEV_KEY_ALIAS: ${{ secrets.IL_DEV_KEY_ALIAS }}
          EXPECTED_SIGNER_SHA256: D96E3617A3E370B2F3F13CDC8C7CCE0BA8AB39C76697BBE227F21AC226445B45
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$DEV_KEYSTORE_BASE64" ] || [ -z "$DEV_STORE_PASSWORD" ] || [ -z "$DEV_KEY_ALIAS" ]; then
            echo "::error::One or more I Launcher signing secrets are not available to this workflow."
            exit 1
          fi

          KEYSTORE=/tmp/i-launcher-development.jks
          echo "$DEV_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"

          echo "### Development keystore entries" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          LC_ALL=C keytool -list -v \
            -keystore "$KEYSTORE" \
            -storepass "$DEV_STORE_PASSWORD" \
            | awk '/^Alias name: / || /^Entry type: / || /^[[:space:]]*SHA256: / {print}' \
            | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          SELECTED_SHA256="$(
            LC_ALL=C keytool -list -v \
              -keystore "$KEYSTORE" \
              -storepass "$DEV_STORE_PASSWORD" \
              -alias "$DEV_KEY_ALIAS" \
              | awk -F': ' '/^[[:space:]]*SHA256: / { print $2; exit }' \
              | tr -d ':' \
              | tr '[:lower:]' '[:upper:]'
          )"

          if [ -z "$SELECTED_SHA256" ]; then
            echo "::error::Could not read certificate SHA-256 for the configured signing alias."
            exit 1
          fi

          echo >> "$GITHUB_STEP_SUMMARY"
          echo "Configured alias certificate SHA-256: \`$SELECTED_SHA256\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Known-good installed certificate SHA-256: \`$EXPECTED_SIGNER_SHA256\`" >> "$GITHUB_STEP_SUMMARY"

          if [ "$SELECTED_SHA256" = "$EXPECTED_SIGNER_SHA256" ]; then
            echo "Result: configured alias matches the known-good installed certificate." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "Result: configured alias DOES NOT match the known-good installed certificate." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

          if LC_ALL=C keytool -list -v -keystore "$KEYSTORE" -storepass "$DEV_STORE_PASSWORD" \
            | tr -d ':' \
            | tr '[:lower:]' '[:upper:]' \
            | grep -q "$EXPECTED_SIGNER_SHA256"; then
            echo "Known-good certificate is present somewhere in the current keystore." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "Known-good certificate is NOT present in the current keystore." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

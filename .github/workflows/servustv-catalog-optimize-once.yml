name: One-off ServusTV catalog cache optimization

on:
  push:
    branches:
      - fix/servustv-progressive-refresh
    paths:
      - .github/workflows/servustv-catalog-optimize-once.yml

permissions:
  contents: write

jobs:
  optimize-test-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Apply catalog cache optimization
        run: python3 .github/scripts/servustv-catalog-optimize-once.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: ServusTV and Launcher unit tests and debug builds
        run: gradle :servustv-provider:testDebugUnitTest :servustv-provider:assembleDebug :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Commit verified change and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -- .github/workflows/servustv-catalog-optimize-once.yml .github/scripts/servustv-catalog-optimize-once.py
          git add -- servustv-provider/src/main/java/com/andreassamitsch/servusprovider/data/ServusNewsRepository.kt
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'perf(servustv): publish catalog before subscribed show refresh and limit requests'
          git push origin HEAD:fix/servustv-progressive-refresh

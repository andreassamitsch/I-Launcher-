name: Apply one-time Live TV hero import fix
on:
  push:
    branches: [feature/joyn-tv-client]
    paths: [.github/workflows/apply-live-tv-info-height-import.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/joyn-tv-client
          persist-credentials: true
      - name: Add verified missing import
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/andreassamitsch/ilauncher/ui/livetv/LiveTvPlayerScreen.kt')
          source = p.read_text(encoding='utf-8')
          anchor = 'import androidx.compose.foundation.layout.fillMaxSize\n'
          assert source.count(anchor) == 1, 'Expected exactly one fillMaxSize import'
          assert 'import androidx.compose.foundation.layout.fillMaxHeight\n' not in source, 'Already imported'
          p.write_text(source.replace(anchor, 'import androidx.compose.foundation.layout.fillMaxHeight\n' + anchor, 1), encoding='utf-8')
          PY
      - name: Commit source and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-live-tv-info-height-import.yml
          git add app/src/main/java/com/andreassamitsch/ilauncher/ui/livetv/LiveTvPlayerScreen.kt
          git commit -m 'fix: import Compose fillMaxHeight for live TV info hero'
          git push origin HEAD:feature/joyn-tv-client

name: Probe ServusTV 90 Artwork

on:
  push:
    branches:
      - feat/servustv-news-provider-prototype
    paths:
      - ".github/workflows/probe-servustv-90-artwork.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch official artwork candidates
        run: |
          set -euo pipefail
          mkdir -p probe
          python3 - <<'PY'
          import json
          import urllib.request
          from pathlib import Path

          headers = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; WOW64; rv:153.0) Gecko/20100101 Firefox/153.0',
              'Accept': '*/*',
              'Accept-Language': 'de-DE,de;q=0.9,en;q=0.8',
              'Origin': 'https://www.servustv.com',
              'Referer': 'https://www.servustv.com/',
          }
          urls = {
              'product.json': 'https://tv-api.redbull.com/products/v5.3/stv/de/at/AAYGF2URW6ALQYE42IJK',
              'display_art.png': 'https://resources.redbull.tv/AAYGF2URW6ALQYE42IJK/rbtv_display_art_landscape/f_png,c_fit,w_1200,q_100?namespace=stv&refresh=true',
              'display_art.webp': 'https://resources.redbull.tv/AAYGF2URW6ALQYE42IJK/rbtv_display_art_landscape/f_webp,c_fit,w_1200,q_100?namespace=stv&refresh=true',
              'background_banner.webp': 'https://resources.redbull.tv/AAYGF2URW6ALQYE42IJK/rbtv_background_banner/f_webp,c_fit,w_1200,q_90?namespace=stv&refresh=true',
              'press.jpg': 'https://presse.servustv.com/Content/985611/8fc9cdca-c44c-4fc1-a58f-1e5fc4f07799/1200/2400/.jpg',
          }
          for name, url in urls.items():
              try:
                  req = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(req, timeout=30) as response:
                      data = response.read()
                      Path('probe', name).write_bytes(data)
                      print(name, response.status, response.headers.get('Content-Type'), len(data), response.geturl())
              except Exception as exc:
                  print('FAILED', name, repr(exc))
          PY
          file probe/* || true
          sha256sum probe/* || true

      - name: Validate image decoding
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          for path in sorted(Path('probe').iterdir()):
              if path.suffix.lower() not in {'.png', '.webp', '.jpg', '.jpeg'}:
                  continue
              try:
                  with Image.open(path) as image:
                      image.load()
                      print(path.name, image.format, image.mode, image.size, image.getbbox())
              except Exception as exc:
                  print('INVALID', path.name, repr(exc))
                  raise
          PY

      - name: Upload probe files
        uses: actions/upload-artifact@v4
        with:
          name: servustv-90-artwork-probe
          path: probe/
          if-no-files-found: error

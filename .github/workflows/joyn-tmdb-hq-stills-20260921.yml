name: Apply Joyn episode text and source-image resolution fix
on:
  push:
    paths:
      - .github/workflows/joyn-tmdb-hq-stills-20260921.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout active Joyn branch
        uses: actions/checkout@v4
        with:
          ref: feature/joyn-tv-client
          persist-credentials: true
      - name: Apply anchored source changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/apply_joyn_tmdb_episode_and_hires_still_20260921.py')
          source = p.read_text()
          old = '    if matches != 1:' + chr(10)
          new = "    if matches != 1 and not (file.name == 'TmdbDtos.kt' and matches in (2, 3) and old.startswith('    @SerializedName(\"original_name\")')):" + chr(10)
          assert source.count(old) == 1
          p.write_text(source.replace(old, new))
          PY
          python3 -m py_compile scripts/apply_joyn_tmdb_episode_and_hires_still_20260921.py
          python3 scripts/apply_joyn_tmdb_episode_and_hires_still_20260921.py
          git diff --check
      - name: Commit source changes and clean up one-off migration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/joyn-tmdb-hq-stills-20260921.yml scripts/apply_joyn_tmdb_episode_and_hires_still_20260921.py
          git add app/src/main/java/com/andreassamitsch/ilauncher/data/tmdb/TmdbDtos.kt app/src/main/java/com/andreassamitsch/ilauncher/data/tv/WatchNextEnrichmentRepository.kt joyntv/src/main/java/com/andreassamitsch/joyntv/JoynApiClient.kt joyntv/src/main/java/com/andreassamitsch/joyntv/JoynContinueWatching.kt joyntv/src/test/java/com/andreassamitsch/joyntv/JoynHighResEpisodeArtworkTest.kt docs/JOYNTV_CURRENT_STATE.md
          git diff --cached --check
          git commit -m 'feat: verify Austrian TMDB episode text and use confirmed larger Joyn stills'
          git push origin HEAD:feature/joyn-tv-client
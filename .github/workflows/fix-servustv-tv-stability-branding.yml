name: Fix ServusTV TV stability and branding
on:
  push:
    branches: [feat/servustv-news-provider-prototype]
    paths: [.github/workflows/fix-servustv-tv-stability-branding.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/servustv-news-provider-prototype
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"
      - name: Apply fixes
        run: |
          echo '' | base64 --decode > /tmp/fix.py
          python3 /tmp/fix.py
      - name: Test and build both apps
        run: gradle :servustv-provider:testDebugUnitTest :servustv-provider:assembleDebug :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Commit tested fixes
        run: |
          rm -f .github/workflows/fix-servustv-tv-stability-branding.yml .github/workflows/probe-servustv-90-logo.yml .github/workflows/fix-servustv-current-logos.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(servustv): stabilize TV hub and correct branding"
          git push origin HEAD:feat/servustv-news-provider-prototype

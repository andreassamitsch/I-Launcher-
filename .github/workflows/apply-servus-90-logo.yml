name: Apply Servus 90-second logo

on:
  push:
    branches: [feat/servustv-news-provider-prototype]
    paths: [.github/workflows/apply-servus-90-logo.yml]

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/servustv-news-provider-prototype
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply branding policy
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one match in {path}, found {count}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          Path('servustv-provider/src/main/java/com/andreassamitsch/servusprovider/data/ServusBranding.kt').write_text('''package com.andreassamitsch.servusprovider.data

/** Canonical show branding that must survive caches and Android TV publication. */
object ServusBranding {
    const val NEWS_90_SECONDS_SHOW_ID = "AAYGF2URW6ALQYE42IJK"
    const val NEWS_90_SECONDS_LOGO_URI =
        "android.resource://com.andreassamitsch.servusprovider/drawable/servus_news_90_logo"

    fun logoUriForShow(showId: String?, fallback: String?): String? =
        if (showId == NEWS_90_SECONDS_SHOW_ID) NEWS_90_SECONDS_LOGO_URI else fallback

    fun logoUriForEpisode(episode: ServusNewsEpisode, fallback: String?): String? =
        if (
            episode.showId == NEWS_90_SECONDS_SHOW_ID ||
            ServusNewsPolicy.contentKind(episode) == ServusContentKind.NEWS_90_SECONDS
        ) NEWS_90_SECONDS_LOGO_URI else fallback
}
''')

          catalog = 'servustv-provider/src/main/java/com/andreassamitsch/servusprovider/data/ServusCatalogPolicy.kt'
          replace_once(catalog, '            logoUri = titleTreatment(id, resources),', '            logoUri = ServusBranding.logoUriForShow(id, titleTreatment(id, resources)),')
          replace_once(catalog, '            logoUri = showLogoUri,', '            logoUri = ServusBranding.logoUriForShow(showId, showLogoUri),')
          replace_once(catalog, '''        if (id == NEWS_90_SECONDS_SHOW_ID) {
            val displayArt = resources.firstOrNull { name ->
                name.equals("rbtv_display_art_landscape", ignoreCase = true)
            }
            if (displayArt != null) {
                return "${ServusNetwork.ARTWORK_BASE_URL}$id/$displayArt/f_webp,c_fill,w_640,q_80?namespace=stv&refresh=true"
            }
        }
''', '')
          replace_once(catalog, '    const val NEWS_90_SECONDS_SHOW_ID = "AAYGF2URW6ALQYE42IJK"', '    const val NEWS_90_SECONDS_SHOW_ID = ServusBranding.NEWS_90_SECONDS_SHOW_ID')

          news = 'servustv-provider/src/main/java/com/andreassamitsch/servusprovider/data/ServusNewsPolicy.kt'
          replace_once(news, '            artworkUri = landscapeArtwork(id, card.mediaResources),\n        )', '            artworkUri = landscapeArtwork(id, card.mediaResources),\n            logoUri = if (kind == ServusContentKind.NEWS_90_SECONDS) ServusBranding.NEWS_90_SECONDS_LOGO_URI else null,\n        )')

          current = 'servustv-provider/src/main/java/com/andreassamitsch/servusprovider/data/ServusCurrentChannelSelectionStore.kt'
          replace_once(current, '                    logoUri = episode.logoUri ?: show.logoUri,', '                    logoUri = ServusBranding.logoUriForShow(show.id, episode.logoUri ?: show.logoUri),')

          publisher = 'servustv-provider/src/main/java/com/andreassamitsch/servusprovider/tv/ServusChannelPublisher.kt'
          replace_once(publisher, 'import com.andreassamitsch.servusprovider.data.ServusCategory\n', 'import com.andreassamitsch.servusprovider.data.ServusBranding\nimport com.andreassamitsch.servusprovider.data.ServusCategory\n')
          replace_once(publisher, '        logoUri?.takeIf { it.isNotBlank() }?.let { builder.setLogoUri(Uri.parse(it)) }', '        ServusBranding.logoUriForEpisode(episode, logoUri ?: episode.logoUri)\n            ?.takeIf { it.isNotBlank() }\n            ?.let { builder.setLogoUri(Uri.parse(it)) }')
          replace_once(publisher, '''    private fun createShowLogo(show: ServusShow): Bitmap {
        val source = show.logoUri?.let(::downloadBitmap)
            ?: show.squareArtworkUri?.let(::downloadBitmap)
            ?: show.artworkUri?.let(::downloadBitmap)
            ?: return createAppLogo()
        return fitOnDarkCanvas(source)
    }
''', '''    private fun createShowLogo(show: ServusShow): Bitmap {
        val source = if (show.id == ServusBranding.NEWS_90_SECONDS_SHOW_ID) {
            BitmapFactory.decodeResource(appContext.resources, R.drawable.servus_news_90_logo)
        } else {
            show.logoUri?.let(::downloadBitmap)
        }
            ?: show.squareArtworkUri?.let(::downloadBitmap)
            ?: show.artworkUri?.let(::downloadBitmap)
            ?: return createAppLogo()
        return fitOnDarkCanvas(source)
    }
''')

          test = 'servustv-provider/src/test/java/com/andreassamitsch/servusprovider/data/ServusCatalogPolicyTest.kt'
          replace_once(test, '''    @Test
    fun ninetySecondNewsUsesItsOwnDisplayArt() {
        val uri = ServusCatalogPolicy.titleTreatment(
            ServusCatalogPolicy.NEWS_90_SECONDS_SHOW_ID,
            listOf("rbtv_background_landscape", "rbtv_display_art_landscape"),
        )
        assertNotNull(uri)
        assertTrue(uri!!.contains("AAYGF2URW6ALQYE42IJK/rbtv_display_art_landscape"))
        assertTrue(uri.contains("w_640"))
    }
''', '''    @Test
    fun ninetySecondNewsUsesDedicatedPackagedLogo() {
        val show = ServusCatalogPolicy.buildShow(
            categoryId = "CAT",
            categoryTitle = "News & Magazine",
            card = ServusCardDto(
                id = ServusCatalogPolicy.NEWS_90_SECONDS_SHOW_ID,
                type = "page",
                title = "Servus Nachrichten in 90 Sekunden",
                mediaResources = listOf("rbtv_display_art_landscape"),
            ),
            detail = null,
            episodes = emptyList(),
        )
        assertNotNull(show)
        assertEquals(ServusBranding.NEWS_90_SECONDS_LOGO_URI, show!!.logoUri)
    }
''')

          Path('servustv-provider/src/test/java/com/andreassamitsch/servusprovider/data/ServusBrandingTest.kt').write_text('''package com.andreassamitsch.servusprovider.data

import com.andreassamitsch.servusprovider.api.ServusCardDto
import org.junit.Assert.assertEquals
import org.junit.Test

class ServusBrandingTest {
    @Test
    fun legacyNinetySecondEpisodeAlwaysGetsDedicatedLogo() {
        val episode = ServusNewsPolicy.toSupportedEpisode(
            ServusCardDto(
                id = "NEWS90",
                type = "video",
                contentType = "episode",
                title = "Servus Nachrichten in 90 Sekunden",
                duration = 90_000L,
                playable = true,
            ),
            nowMillis = 1_000L,
        )!!
        assertEquals(ServusBranding.NEWS_90_SECONDS_LOGO_URI, episode.logoUri)
        assertEquals(ServusBranding.NEWS_90_SECONDS_LOGO_URI, ServusBranding.logoUriForEpisode(episode, "https://wrong.example/logo.webp"))
    }

    @Test
    fun normalServusNewsKeepsFallbackLogo() {
        val episode = ServusNewsEpisode(
            id = "FULL",
            title = "Servus Nachrichten 19:20",
            showName = "Servus Nachrichten",
            description = null,
            durationMillis = 600_000L,
            publishedAtMillis = null,
            artworkUri = null,
        )
        assertEquals("https://example.test/full-news.webp", ServusBranding.logoUriForEpisode(episode, "https://example.test/full-news.webp"))
    }
}
''')
          PY
      - name: Test and build
        run: ./gradlew :servustv-provider:testDebugUnitTest :servustv-provider:assembleDebug :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Commit implementation
        shell: bash
        run: |
          rm -f .github/workflows/apply-servus-90-logo.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(servustv): use dedicated 90-second news logo"
          git push origin HEAD:feat/servustv-news-provider-prototype

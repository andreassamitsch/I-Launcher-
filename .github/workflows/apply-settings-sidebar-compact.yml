name: Apply Settings Sidebar Compact Patch

on:
  push:
    branches:
      - agent/settings-ui-overhaul
    paths:
      - ".github/settings-sidebar-compact.trigger"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/settings-ui-overhaul

      - name: Compact settings sidebar header
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/src/main/java/com/andreassamitsch/ilauncher/ui/settings/SettingsScreen.kt")
          text = path.read_text()

          replacements = [
              (
                  '''            .padding(horizontal = 14.dp, vertical = 18.dp),\n        verticalArrangement = Arrangement.spacedBy(8.dp),''',
                  '''            .padding(horizontal = 14.dp, vertical = 14.dp),\n        verticalArrangement = Arrangement.spacedBy(6.dp),''',
              ),
              (
                  '''        Text(\n            text = "I LAUNCHER",\n            style = MaterialTheme.typography.labelLarge,\n            color = MaterialTheme.colorScheme.primary,\n            modifier = Modifier.padding(horizontal = 10.dp),\n        )\n''',
                  '',
              ),
              (
                  '''        Text(\n            text = "Bereiche auswählen",\n            style = MaterialTheme.typography.bodySmall,\n            color = MaterialTheme.colorScheme.onSurfaceVariant,\n            modifier = Modifier.padding(horizontal = 10.dp, vertical = 2.dp),\n        )\n        Spacer(modifier = Modifier.size(6.dp))''',
                  '''        Spacer(modifier = Modifier.size(2.dp))''',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match, found {count}: {old[:80]!r}")
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Commit compact sidebar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/andreassamitsch/ilauncher/ui/settings/SettingsScreen.kt
          git diff --cached --check
          git commit -m "fix: compact settings sidebar header"
          git push origin HEAD:agent/settings-ui-overhaul

name: TV Discovery Visual Smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "app/src/main/java/com/andreassamitsch/ilauncher/ui/discover/**"
      - "app/src/main/java/com/andreassamitsch/ilauncher/ui/GoogleTvTopNavigation.kt"
      - "app/src/debug/java/com/andreassamitsch/ilauncher/ui/preview/DiscoveryPreviewActivity.kt"
      - "app/src/debug/AndroidManifest.xml"
      - ".github/workflows/tv-discovery-visual-smoke.yml"

permissions:
  contents: read

jobs:
  screenshot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Capture deterministic movie and series discovery screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: android-tv
          arch: x86
          profile: tv_1080p
          emulator-options: >-
            -no-snapshot-save -no-window -gpu swiftshader_indirect
            -noaudio -no-boot-anim
          disable-animations: true
          script: |
            gradle :app:assembleDebug --stacktrace
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            mkdir -p build/tv-discovery-visual
            adb logcat -c
            adb shell am start -W -n com.andreassamitsch.ilauncher/.ui.preview.DiscoveryPreviewActivity
            sleep 3
            adb shell dumpsys activity activities | grep -m1 -E 'topResumedActivity|ResumedActivity' | grep -q 'com.andreassamitsch.ilauncher/.ui.preview.DiscoveryPreviewActivity' || (adb logcat -d -v time > build/tv-discovery-visual/logcat-failure.txt; adb shell dumpsys activity activities > build/tv-discovery-visual/activity-failure.txt; exit 1)
            adb exec-out screencap -p > build/tv-discovery-visual/movies-nav.png
            adb shell input keyevent 20
            sleep 1
            adb shell dumpsys activity activities | grep -m1 -E 'topResumedActivity|ResumedActivity' | grep -q 'com.andreassamitsch.ilauncher/.ui.preview.DiscoveryPreviewActivity' || (adb logcat -d -v time > build/tv-discovery-visual/logcat-failure.txt; adb shell dumpsys activity activities > build/tv-discovery-visual/activity-failure.txt; exit 1)
            adb exec-out screencap -p > build/tv-discovery-visual/movies-first-card.png
            adb shell input keyevent 22
            sleep 1
            adb shell dumpsys activity activities | grep -m1 -E 'topResumedActivity|ResumedActivity' | grep -q 'com.andreassamitsch.ilauncher/.ui.preview.DiscoveryPreviewActivity' || (adb logcat -d -v time > build/tv-discovery-visual/logcat-failure.txt; adb shell dumpsys activity activities > build/tv-discovery-visual/activity-failure.txt; exit 1)
            adb exec-out screencap -p > build/tv-discovery-visual/movies-second-card.png
            adb shell input keyevent 20
            sleep 1
            adb shell dumpsys activity activities | grep -m1 -E 'topResumedActivity|ResumedActivity' | grep -q 'com.andreassamitsch.ilauncher/.ui.preview.DiscoveryPreviewActivity' || (adb logcat -d -v time > build/tv-discovery-visual/logcat-failure.txt; adb shell dumpsys activity activities > build/tv-discovery-visual/activity-failure.txt; exit 1)
            adb exec-out screencap -p > build/tv-discovery-visual/movies-second-row.png
            adb shell am force-stop com.andreassamitsch.ilauncher
            adb shell am start -W -n com.andreassamitsch.ilauncher/.ui.preview.DiscoveryPreviewActivity --es type series
            sleep 3
            adb shell dumpsys activity activities | grep -m1 -E 'topResumedActivity|ResumedActivity' | grep -q 'com.andreassamitsch.ilauncher/.ui.preview.DiscoveryPreviewActivity' || (adb logcat -d -v time > build/tv-discovery-visual/logcat-failure.txt; adb shell dumpsys activity activities > build/tv-discovery-visual/activity-failure.txt; exit 1)
            adb exec-out screencap -p > build/tv-discovery-visual/series-nav.png
            adb shell input keyevent 20
            sleep 1
            adb shell dumpsys activity activities | grep -m1 -E 'topResumedActivity|ResumedActivity' | grep -q 'com.andreassamitsch.ilauncher/.ui.preview.DiscoveryPreviewActivity' || (adb logcat -d -v time > build/tv-discovery-visual/logcat-failure.txt; adb shell dumpsys activity activities > build/tv-discovery-visual/activity-failure.txt; exit 1)
            adb exec-out screencap -p > build/tv-discovery-visual/series-first-card.png
            adb shell input keyevent 22
            sleep 1
            adb shell dumpsys activity activities | grep -m1 -E 'topResumedActivity|ResumedActivity' | grep -q 'com.andreassamitsch.ilauncher/.ui.preview.DiscoveryPreviewActivity' || (adb logcat -d -v time > build/tv-discovery-visual/logcat-failure.txt; adb shell dumpsys activity activities > build/tv-discovery-visual/activity-failure.txt; exit 1)
            adb exec-out screencap -p > build/tv-discovery-visual/series-second-card.png
            adb shell input keyevent 20
            sleep 1
            adb shell dumpsys activity activities | grep -m1 -E 'topResumedActivity|ResumedActivity' | grep -q 'com.andreassamitsch.ilauncher/.ui.preview.DiscoveryPreviewActivity' || (adb logcat -d -v time > build/tv-discovery-visual/logcat-failure.txt; adb shell dumpsys activity activities > build/tv-discovery-visual/activity-failure.txt; exit 1)
            adb exec-out screencap -p > build/tv-discovery-visual/series-second-row.png

      - name: Upload TV discovery visual smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tv-discovery-visual-smoke
          path: build/tv-discovery-visual/
          if-no-files-found: warn

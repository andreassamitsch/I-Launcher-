name: Fix CloudStream session patch anchors once
on:
  push:
    paths:
      - .github/workflows/fix-cloudstream-session-script-once.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cloudstream-direct-play
          persist-credentials: true
      - name: Make same-text automatic and selected-player patches distinct
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/cloudstream-bridge/apply_external_session_fix.py')
          t=p.read_text()
          old="""    if count != expected:
              raise RuntimeError(f'{path}: expected {expected} anchor(s), found {count}: {old[:160]!r}')
          """
          # Only the first of the two identical automatic/selected handoff snippets is updated
          # in the automatic pass. The selected pass then applies its own token guard.
          first="""    if count != expected:
                  raise RuntimeError"""
          if first in t:
              raise RuntimeError('Unexpected patch-helper indentation')
          original="""    if count != expected:
          raise RuntimeError(f'{path}: expected {expected} anchor(s), found {count}: {old[:160]!r}')
          path.write_text(text.replace(old, new), encoding='utf-8')"""
          if t.count(original)!=1:
              raise RuntimeError('Patch helper changed; stop instead of editing a new version')
          changed="""    if count != expected and not (expected == 1 and count == 2 and old.startswith('                launchPreparedPlayback(activity, prepared)')):
          raise RuntimeError(f'{path}: expected {expected} anchor(s), found {count}: {old[:160]!r}')
          path.write_text(text.replace(old, new, expected), encoding='utf-8')"""
          p.write_text(t.replace(original,changed,1))
          print('automatic and selected handoff anchors can now be patched independently')
          PY
      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-cloudstream-session-script-once.yml
          git add tools/cloudstream-bridge/apply_external_session_fix.py
          git diff --cached --check
          git commit -m 'fix: patch separate CloudStream automatic and selected player paths'
          git push origin HEAD:agent/cloudstream-direct-play

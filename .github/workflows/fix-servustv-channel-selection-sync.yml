name: Fix ServusTV channel selection sync

on:
  push:
    branches:
      - feat/servustv-news-provider-prototype
    paths:
      - .github/workflows/fix-servustv-channel-selection-sync.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/servustv-news-provider-prototype
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Apply selection sync fix
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"anchor missing: {path}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          store = 'servustv-provider/src/main/java/com/andreassamitsch/servusprovider/data/ServusShowChannelSelectionStore.kt'
          replace(store,
          '''    fun isSelected(showId: String): Boolean = showId in selectedShowIds()

    fun setSelected(showId: String, selected: Boolean) {
        val ids = selectedShowIds().toMutableSet()
        if (selected) ids += showId else ids -= showId
        preferences.edit().putStringSet(KEY_SELECTED_SHOW_IDS, ids).apply()
    }

    private companion object {
        const val PREFS_NAME = "servus_show_channel_selection"
        const val KEY_SELECTED_SHOW_IDS = "selected_show_ids"
    }
''',
          '''    fun isSelected(showId: String): Boolean = showId in selectedShowIds()

    /** True on first run after the opt-in model is introduced and after every selection change. */
    fun needsTvProviderSync(): Boolean =
        !preferences.getBoolean(KEY_SYNC_INITIALIZED, false) ||
            preferences.getBoolean(KEY_SYNC_PENDING, false)

    fun setSelected(showId: String, selected: Boolean) {
        val ids = selectedShowIds().toMutableSet()
        val changed = if (selected) ids.add(showId) else ids.remove(showId)
        if (!changed) return
        preferences.edit()
            .putStringSet(KEY_SELECTED_SHOW_IDS, ids)
            .putBoolean(KEY_SYNC_PENDING, true)
            .apply()
    }

    fun markTvProviderSynced() {
        preferences.edit()
            .putBoolean(KEY_SYNC_INITIALIZED, true)
            .putBoolean(KEY_SYNC_PENDING, false)
            .apply()
    }

    private companion object {
        const val PREFS_NAME = "servus_show_channel_selection"
        const val KEY_SELECTED_SHOW_IDS = "selected_show_ids"
        const val KEY_SYNC_INITIALIZED = "tv_provider_sync_initialized"
        const val KEY_SYNC_PENDING = "tv_provider_sync_pending"
    }
''')

          publisher = 'servustv-provider/src/main/java/com/andreassamitsch/servusprovider/tv/ServusChannelPublisher.kt'
          replace(publisher,
          '''        if (currentSelectionStore.isConfigured()) {
            publish(newsStore.loadEpisodes())
        }
    }

    /** One aggregate rail that contains every ServusTV live station as a directly playable card. */
''',
          '''        if (currentSelectionStore.isConfigured()) {
            publish(newsStore.loadEpisodes())
        }
        showChannelSelectionStore.markTvProviderSynced()
    }

    /** Removes one opted-out show channel immediately; the pending flag still reconciles later. */
    fun removeShowChannel(showId: String) {
        if (!isSupported()) return
        helper.getAllChannels()
            .firstOrNull { it.internalProviderId == showInternalId(showId) }
            ?.let { channel ->
                appContext.contentResolver.delete(TvContractCompat.buildChannelUri(channel.id), null, null)
            }
    }

    /** One aggregate rail that contains every ServusTV live station as a directly playable card. */
''')

          repo = 'servustv-provider/src/main/java/com/andreassamitsch/servusprovider/data/ServusNewsRepository.kt'
          replace(repo,
          '''    fun setShowChannelSelected(showId: String, selected: Boolean) {
        if (selected) {
            hubStore.findShow(showId)?.let { show -> observedAvailabilityStore.baseline(show.episodes) }
        }
        showChannelSelectionStore.setSelected(showId, selected)
    }
''',
          '''    fun setShowChannelSelected(showId: String, selected: Boolean) {
        if (selected) {
            hubStore.findShow(showId)?.let { show -> observedAvailabilityStore.baseline(show.episodes) }
        }
        showChannelSelectionStore.setSelected(showId, selected)
        if (!selected) {
            runCatching { channelPublisher.removeShowChannel(showId) }
                .onFailure { throwable ->
                    Log.w(TAG, "Immediate show-channel removal skipped (${throwable.javaClass.simpleName})")
                }
        }
    }
''')
          replace(repo,
          '''                    if ((catalogRefreshSucceeded || periodicShowsRefreshed) && categories.isNotEmpty()) {
                        channelPublisher.publishShows(categories)
                    }
''',
          '''                    val showChannelSelectionChanged = showChannelSelectionStore.needsTvProviderSync()
                    if ((catalogRefreshSucceeded || periodicShowsRefreshed || showChannelSelectionChanged) &&
                        categories.isNotEmpty()
                    ) {
                        channelPublisher.publishShows(categories)
                    }
''')

          main = 'servustv-provider/src/main/java/com/andreassamitsch/servusprovider/ui/MainActivity.kt'
          replace(main,
          '''        statusText.text = buildString {
            append("Version ${BuildConfig.VERSION_NAME}")
            if (success > 0L) {
                append("\\n")
                append("Letzte Aktualisierung: ")
''',
          '''        statusText.text = buildString {
            append("Version ${BuildConfig.VERSION_NAME}")
            append("\\n")
            if (success > 0L) {
                append("Letzte Aktualisierung: ")
''')
          PY

      - name: Test and build
        run: gradle :servustv-provider:testDebugUnitTest :servustv-provider:assembleDebug --stacktrace

      - name: Commit tested fix
        shell: bash
        run: |
          rm .github/workflows/fix-servustv-channel-selection-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(servustv): sync show channel selection changes"
          git push origin HEAD:feat/servustv-news-provider-prototype

name: TV Visual Smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "app/src/main/java/com/andreassamitsch/ilauncher/ui/**"
      - "app/src/debug/**"
      - "app/build.gradle.kts"
      - "app/proguard-development.pro"
      - ".github/workflows/tv-visual-smoke.yml"
      - "scripts/ci/tv-visual-smoke.sh"

permissions:
  contents: read

jobs:
  screenshot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Capture deterministic 1080p TV screenshots and navigation video
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: android-tv
          arch: x86
          profile: tv_1080p
          emulator-options: >-
            -no-snapshot-save -no-window -gpu swiftshader_indirect
            -noaudio -no-boot-anim
          disable-animations: true
          script: |
            bash scripts/ci/tv-visual-smoke.sh

      - name: Upload TV visual smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tv-visual-smoke
          path: build/tv-visual/
          if-no-files-found: warn

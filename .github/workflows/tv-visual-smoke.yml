name: TV Visual Smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "app/src/main/java/com/andreassamitsch/ilauncher/ui/**"
      - "app/src/debug/**"
      - ".github/workflows/tv-visual-smoke.yml"

permissions:
  contents: read

jobs:
  screenshot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Capture deterministic 1080p TV screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: android-tv
          arch: x86
          profile: tv_1080p
          emulator-options: >-
            -no-snapshot-save -no-window -gpu swiftshader_indirect
            -noaudio -no-boot-anim
          disable-animations: true
          script: |
            gradle :app:assembleDebug --stacktrace
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            mkdir -p build/tv-visual

            adb shell am start -W -n com.andreassamitsch.ilauncher/.ui.preview.UiPreviewActivity
            sleep 4
            adb exec-out screencap -p > build/tv-visual/home-initial.png
            adb shell input keyevent 20
            sleep 1
            adb exec-out screencap -p > build/tv-visual/home-first-rail.png
            adb shell input keyevent 20
            sleep 1
            adb shell input keyevent 20
            sleep 1
            adb exec-out screencap -p > build/tv-visual/home-deep-rail.png

            adb shell am force-stop com.andreassamitsch.ilauncher
            adb shell am start -W -n com.andreassamitsch.ilauncher/.ui.preview.UiPreviewActivity --es screen search-discover
            sleep 3
            adb exec-out screencap -p > build/tv-visual/search-discover.png

            adb shell am force-stop com.andreassamitsch.ilauncher
            adb shell am start -W -n com.andreassamitsch.ilauncher/.ui.preview.UiPreviewActivity --es screen search-results
            sleep 3
            adb exec-out screencap -p > build/tv-visual/search-results.png

      - name: Upload TV visual smoke screenshots
        uses: actions/upload-artifact@v4
        with:
          name: tv-visual-smoke
          path: build/tv-visual/
          if-no-files-found: error

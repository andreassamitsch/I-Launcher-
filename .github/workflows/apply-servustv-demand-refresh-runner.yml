name: Run ServusTV demand refresh patch

on:
  push:
    branches:
      - feat/servustv-news-provider-prototype
    paths:
      - .github/workflows/apply-servustv-demand-refresh-runner.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/servustv-news-provider-prototype
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Extract and apply patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import subprocess

          workflow = Path('.github/workflows/apply-servustv-demand-refresh.yml').read_text()
          marker_start = "          python3 <<'PY'\n"
          marker_end = "\n          PY\n\n      - name: Test and build ServusTV"
          start = workflow.index(marker_start) + len(marker_start)
          end = workflow.index(marker_end, start)
          embedded = workflow[start:end]
          output = []
          in_triple = False
          for line in embedded.splitlines():
              if not in_triple and line.startswith('          '):
                  line = line[10:]
              output.append(line)
              if line.count("'''") % 2 == 1:
                  in_triple = not in_triple
          script = '\n'.join(output) + '\n'

          block_start = "replace(\n    main,\n    '''            if (repository.tvChannelSupported()) {"
          block_end = "replace(\n    main,\n    '''        val selected = currentSelectionStore.isSelected(show, categories)"
          start_idx = script.index(block_start)
          end_idx = script.index(block_end, start_idx)
          script = script[:start_idx] + script[end_idx:]

          Path('/tmp/apply_servustv.py').write_text(script)
          subprocess.run(['python3', '/tmp/apply_servustv.py'], check=True)

          main = Path('servustv-provider/src/main/java/com/andreassamitsch/servusprovider/ui/MainActivity.kt')
          text = main.read_text()
          text = text.replace(
              'if (showCount > 0) append(" + $showCount Sendungskanäle")',
              'if (tvShowCount > 0) append(" + $tvShowCount aktivierte Sendungskanäle")',
          )
          status_end = 'repository.lastError()?.takeIf { it.isNotBlank() }?.let { append("\\nLetzter Datenfehler: $it") }\n        }\n        renderContent()'
          if status_end not in text:
              raise SystemExit('MainActivity status end anchor missing')
          text = text.replace(
              status_end,
              'repository.lastError()?.takeIf { it.isNotBlank() }?.let { append("\\nLetzter Datenfehler: $it") }\n        }\n        renderDeveloperInfoVisibility()\n        renderContent()',
              1,
          )
          text = text.replace('append("\\\\n")', 'append("\\n")')
          main.write_text(text)

          playback = Path('servustv-provider/src/main/java/com/andreassamitsch/servusprovider/ui/PlaybackActivity.kt')
          playback_text = playback.read_text().replace(
              'scaleType = ImageButton.ScaleType.CENTER_INSIDE',
              'scaleType = android.widget.ImageView.ScaleType.CENTER_INSIDE',
          )
          playback.write_text(playback_text)
          PY

      - name: Test and build ServusTV
        run: gradle :servustv-provider:testDebugUnitTest :servustv-provider:assembleDebug --stacktrace

      - name: Commit tested changes
        shell: bash
        run: |
          rm .github/workflows/apply-servustv-demand-refresh.yml
          rm .github/workflows/apply-servustv-demand-refresh-runner.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(servustv): refresh show episodes on demand"
          git push origin HEAD:feat/servustv-news-provider-prototype

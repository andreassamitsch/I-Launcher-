name: Optimize ServusTV current fetch once

on:
  push:
    branches:
      - fix/servustv-progressive-refresh
    paths:
      - .github/workflows/optimize-servustv-current-once.yml

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/servustv-progressive-refresh
          persist-credentials: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Apply bounded early detail fetching and timings
        run: python3 tools/optimize_servustv_current_once.py
      - name: Test and build affected app and launcher
        run: gradle :servustv-provider:testDebugUnitTest :servustv-provider:assembleDebug :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Commit tested source and remove one-off tooling
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/optimize-servustv-current-once.yml tools/optimize_servustv_current_once.py
          git add servustv-provider/src/main/java/com/andreassamitsch/servusprovider/data/ServusNewsRepository.kt .github/workflows/optimize-servustv-current-once.yml tools/optimize_servustv_current_once.py
          git commit -m 'perf(servustv): overlap bounded detail fetch with discovery and log timings'
          git push origin HEAD:fix/servustv-progressive-refresh

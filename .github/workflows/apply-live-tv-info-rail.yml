name: Apply one-time Live TV info rail
on:
  push:
    branches: [feature/joyn-tv-client]
    paths: [.github/workflows/apply-live-tv-info-rail.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/joyn-tv-client
          persist-credentials: true
      - name: Apply checked code migration
        run: python3 scripts/apply-live-tv-info-rail.py
      - name: Commit changes and delete temporary migration tooling
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm scripts/apply-live-tv-info-rail.py .github/workflows/apply-live-tv-info-rail.yml
          git add app/src/main/java/com/andreassamitsch/ilauncher/ui/livetv/LiveTvPlayerScreen.kt app/src/main/java/com/andreassamitsch/ilauncher/ui/livetv/LiveTvProgramHero.kt app/src/main/java/com/andreassamitsch/ilauncher/ui/details/DetailsScreen.kt app/src/main/java/com/andreassamitsch/ilauncher/ui/LauncherApp.kt
          git commit -m 'feat: keep Live TV info hero with focused channel rail and episode selection'
          git push origin HEAD:feature/joyn-tv-client

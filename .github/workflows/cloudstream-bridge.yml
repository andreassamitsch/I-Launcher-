name: Build CloudStream I Launcher Bridge

on:
  push:
    branches:
      - agent/cloudstream-direct-play
    paths:
      - "tools/cloudstream-bridge/**"
      - ".github/workflows/cloudstream-bridge.yml"
  workflow_dispatch:

concurrency:
  group: cloudstream-i-launcher-bridge-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-cloudstream-bridge:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout I Launcher patch sources
        uses: actions/checkout@v4
        with:
          path: i-launcher

      - name: Checkout exact CloudStream base
        uses: actions/checkout@v4
        with:
          repository: recloudstream/cloudstream
          ref: a72f9e6c3f2e25eb74ce0e7d6cc56dc33c130288
          path: cloudstream
          submodules: recursive
          fetch-depth: 1

      - name: Reproduce Watch Next fix and apply I Launcher bridge
        run: |
          python i-launcher/tools/cloudstream-bridge/apply_patch.py cloudstream
          python i-launcher/tools/cloudstream-bridge/apply_behavior_fixes.py cloudstream

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Configure stable bridge signing
        env:
          DEV_KEYSTORE_BASE64: ${{ secrets.IL_DEV_KEYSTORE_BASE64 }}
          DEV_STORE_PASSWORD: ${{ secrets.IL_DEV_STORE_PASSWORD }}
          DEV_KEY_ALIAS: ${{ secrets.IL_DEV_KEY_ALIAS }}
          DEV_KEY_PASSWORD: ${{ secrets.IL_DEV_KEY_PASSWORD }}
        run: |
          if [ -z "$DEV_KEYSTORE_BASE64" ] || [ -z "$DEV_STORE_PASSWORD" ] || [ -z "$DEV_KEY_ALIAS" ] || [ -z "$DEV_KEY_PASSWORD" ]; then
            echo "::error::Stable development signing secrets are required for the CloudStream bridge build."
            exit 1
          fi
          mkdir -p "$HOME/work/_temp/keystore"
          echo "$DEV_KEYSTORE_BASE64" | base64 --decode > "$HOME/work/_temp/keystore/i-launcher-development.jks"
          echo "SIGNING_STORE_PASSWORD=$DEV_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_ALIAS=$DEV_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_PASSWORD=$DEV_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Test and build CloudStream prerelease debug APK
        working-directory: cloudstream
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testPrereleaseDebugUnitTest :app:assemblePrereleaseDebug --stacktrace

      - name: Verify package and prepare development channel
        run: |
          APK=$(find cloudstream/app/build/outputs/apk/prerelease/debug -name '*.apk' -type f | head -n 1)
          if [ -z "$APK" ]; then
            echo "::error::CloudStream prerelease debug APK not found"
            exit 1
          fi

          cp "$APK" CloudStream-I-Launcher-Bridge.apk
          SHA256=$(sha256sum CloudStream-I-Launcher-Bridge.apk | awk '{print $1}')
          printf '%s  %s\n' "$SHA256" "CloudStream-I-Launcher-Bridge.apk" > CloudStream-I-Launcher-Bridge.sha256

          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          if [ -z "$AAPT" ]; then
            echo "::error::aapt not found"
            exit 1
          fi
          BADGING=$($AAPT dump badging CloudStream-I-Launcher-Bridge.apk | head -n 1)
          VERSION_CODE=$(printf '%s\n' "$BADGING" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")
          if [ -z "$VERSION_CODE" ]; then
            echo "::error::Unable to read APK versionCode"
            exit 1
          fi
          BRIDGE_VERSION_NAME="4.8.0-PRE-I-Launcher.${GITHUB_RUN_NUMBER}"

          cat > update.json <<EOF
          {
            "versionCode": $VERSION_CODE,
            "versionName": "$BRIDGE_VERSION_NAME",
            "apkUrl": "https://raw.githubusercontent.com/andreassamitsch/I-Launcher-/cloudstream-downloads/CloudStream-I-Launcher-Bridge.apk",
            "sha256": "$SHA256",
            "sourceSha": "$GITHUB_SHA"
          }
          EOF
          echo "BRIDGE_VERSION_NAME=$BRIDGE_VERSION_NAME" >> "$GITHUB_ENV"
          echo "BRIDGE_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"

      - name: Upload CloudStream bridge APK
        uses: actions/upload-artifact@v4
        with:
          name: CloudStream-I-Launcher-Bridge
          path: |
            CloudStream-I-Launcher-Bridge.apk
            CloudStream-I-Launcher-Bridge.sha256
            update.json
          retention-days: 90

      - name: Publish stable CloudStream development download branch
        run: |
          git -C i-launcher config user.name "github-actions[bot]"
          git -C i-launcher config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C i-launcher checkout --orphan cloudstream-publish
          git -C i-launcher rm -rf .

          cp CloudStream-I-Launcher-Bridge.apk i-launcher/CloudStream-I-Launcher-Bridge.apk
          cp CloudStream-I-Launcher-Bridge.sha256 i-launcher/CloudStream-I-Launcher-Bridge.sha256
          cp update.json i-launcher/update.json
          cat > i-launcher/README.md <<EOF
          # CloudStream I Launcher Bridge

          Diese Branch enthält die aktuelle signierte Development-APK der CloudStream-Anpassung für I Launcher.

          - APK: https://raw.githubusercontent.com/andreassamitsch/I-Launcher-/cloudstream-downloads/CloudStream-I-Launcher-Bridge.apk
          - Update-Manifest: https://raw.githubusercontent.com/andreassamitsch/I-Launcher-/cloudstream-downloads/update.json
          - Version: $BRIDGE_VERSION_NAME ($BRIDGE_VERSION_CODE)
          - Source: $GITHUB_SHA

          Die APK wird aus dem fixierten CloudStream-Upstream-Commit a72f9e6c3f2e25eb74ce0e7d6cc56dc33c130288 plus den versionierten Bridge-Patches gebaut und mit dem stabilen I-Launcher-Development-Key signiert.
          EOF
          touch i-launcher/.nojekyll

          git -C i-launcher add CloudStream-I-Launcher-Bridge.apk CloudStream-I-Launcher-Bridge.sha256 update.json README.md .nojekyll
          git -C i-launcher commit -m "chore: publish CloudStream bridge $BRIDGE_VERSION_NAME"
          git -C i-launcher push origin HEAD:cloudstream-downloads --force

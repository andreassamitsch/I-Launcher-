name: Probe ServusTV API

on:
  push:
    branches:
      - feat/servustv-news-provider-prototype
    paths:
      - ".github/workflows/probe-servus-api.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe public ServusTV API
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import urllib.parse
          import urllib.request
          import urllib.error

          BASE = "https://tv-api.redbull.com/"
          MARKET = "at"
          HEADERS = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140 Safari/537.36",
              "Accept": "application/json, text/plain, */*",
              "Accept-Language": "de-DE,de;q=0.9,en;q=0.8",
              "Origin": "https://www.servustv.com",
              "Referer": "https://www.servustv.com/",
          }

          def get(path, params=None):
              url = urllib.parse.urljoin(BASE, path)
              if params:
                  url += "?" + urllib.parse.urlencode(params)
              req = urllib.request.Request(url, headers=HEADERS)
              try:
                  with urllib.request.urlopen(req, timeout=20) as response:
                      return response.status, url, json.loads(response.read().decode("utf-8"))
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode("utf-8", "replace")[:300]
                  print(f"HTTP {exc.code}: {url} body={body!r}")
                  return exc.code, url, None

          def card_summary(card):
              return {
                  k: card.get(k) for k in (
                      "id", "type", "content_type", "title", "show_name", "duration",
                      "playable", "sunrise_timestamp", "start_time", "end_time"
                  ) if k in card
              }

          def summarize(label, result, preview=4):
              status, url, data = result
              print(f"\n=== {label} ===")
              print(f"status={status} url={url}")
              if not isinstance(data, dict): return data
              cards = data.get("cards") or []
              collections = data.get("collections") or []
              print(f"cards={len(cards)} collections={len(collections)} meta={json.dumps(data.get('meta'), ensure_ascii=False, sort_keys=True)}")
              if cards:
                  print("card_keys=", sorted(cards[0].keys()))
                  print("cards_preview=", json.dumps([card_summary(c) for c in cards[:preview]], ensure_ascii=False, sort_keys=True))
              if collections:
                  print("collections_preview=", json.dumps([
                      {k: item.get(k) for k in ("id", "list_type", "label")}
                      for item in collections[:8]
                  ], ensure_ascii=False, sort_keys=True))
              return data

          queries = [
              "Servus Nachrichten",
              "Nachrichten 19:20",
              "Servus Nachrichten in 90 Sekunden",
              "Der Wegscheider",
          ]
          first_search = None
          for query in queries:
              data = summarize(
                  f"search {query}",
                  get(f"search/v5/stv/de/{MARKET}/top_results", {"q": query, "offset": 0}),
              )
              if query == "Servus Nachrichten": first_search = data

          page_id = None
          if isinstance(first_search, dict):
              for card in first_search.get("cards") or []:
                  if card.get("type") == "page" and card.get("id"):
                      page_id = card["id"]
                      break

          if page_id:
              page = summarize("first search page product", get(f"products/v5.3/stv/de/{MARKET}/{page_id}"))
              collection_id = None
              if isinstance(page, dict):
                  for ref in page.get("collections") or []:
                      if ref.get("id") and ref.get("list_type") != "reference":
                          collection_id = ref["id"]
                          break
              if collection_id:
                  collection = summarize(
                      "first search page collection",
                      get(f"collections/v5.3/stv/de/{MARKET}/{collection_id}", {"offset": 0}),
                      preview=10,
                  )
                  if isinstance(collection, dict):
                      direct_mappable = [c for c in collection.get("cards") or [] if c.get("duration") and c.get("playable") is not False and c.get("sunrise_timestamp")]
                      print(f"direct_mappable_with_duration_playable_sunrise={len(direct_mappable)}")
          PY

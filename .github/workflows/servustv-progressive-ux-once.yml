name: One-off ServusTV progressive catalog and TV focus
on:
  push:
    branches:
      - fix/servustv-progressive-refresh
    paths:
      - .github/workflows/servustv-progressive-ux-once.yml
permissions:
  contents: write
jobs:
  implement-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Apply checked progressive catalog, episode and rail changes
        run: python3 .github/scripts/servustv-progressive-ux.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Regression unit tests and debug builds
        run: gradle :servustv-provider:testDebugUnitTest :servustv-provider:assembleDebug :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Commit only verified sources and remove temporary workflow/script
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -- .github/workflows/servustv-progressive-ux-once.yml .github/scripts/servustv-progressive-ux.py
          git add -- servustv-provider/src/main/java/com/andreassamitsch/servusprovider/data/ServusNewsRepository.kt servustv-provider/src/main/java/com/andreassamitsch/servusprovider/data/ServusShowPager.kt servustv-provider/src/main/java/com/andreassamitsch/servusprovider/ui/ShowActivity.kt servustv-provider/src/main/java/com/andreassamitsch/servusprovider/ui/MainActivity.kt
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'perf(servustv): show first-page content early and reuse TV rails'
          git push origin HEAD:fix/servustv-progressive-refresh

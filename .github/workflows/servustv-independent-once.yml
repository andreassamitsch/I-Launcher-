name: One-off ServusTV isolated refresh optimization
on:
  push:
    branches:
      - fix/servustv-progressive-refresh
    paths:
      - .github/workflows/servustv-independent-once.yml
permissions:
  contents: write
jobs:
  implement-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Implement independent refresh and selective periodic fetch
        run: |
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          source = subprocess.check_output(['git', 'show', '6c434aed706d1b78a9405cc5f3f18dff955e35c7:.github/workflows/servustv-independent-once.yml'], text=True)
          block = source.split("          python3 - <<'PY'\n", 1)[1].split("\n          PY\n", 1)[0]
          inside = False
          lines = []
          for raw in block.splitlines():
              line = raw if inside else raw.removeprefix('          ')
              lines.append(line)
              if line.count("'''") % 2:
                  inside = not inside
          assert not inside, 'Unclosed original Python string'
          exec(compile('\n'.join(lines), '<validated-one-off-servustv-patch>', 'exec'))
          path = Path('servustv-provider/src/main/java/com/andreassamitsch/servusprovider/data/ServusNewsRepository.kt')
          src = path.read_text()
          old = '            val result = currentResult ?: ServusRefreshResult(previousEpisodes, newsStore.lastSuccessMillis())\n            var categories = initialCategories\n'
          assert src.count(old) == 1, 'Expected exactly one result handoff'
          src = src.replace(old, old.replace('            var categories', '            val episodes = result.episodes\n            var categories'), 1)
          path.write_text(src)
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Unit tests and debug builds (ServusTV and Launcher)
        run: gradle :servustv-provider:testDebugUnitTest :servustv-provider:assembleDebug :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Commit only verified sources and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -- .github/workflows/servustv-independent-once.yml
          git add -- servustv-provider/src/main/java/com/andreassamitsch/servusprovider/data/ServusNewsRepository.kt servustv-provider/src/main/java/com/andreassamitsch/servusprovider/data/ServusShowRefreshSchedulePolicy.kt servustv-provider/src/main/java/com/andreassamitsch/servusprovider/api/ServusResilientApi.kt servustv-provider/src/test/java/com/andreassamitsch/servusprovider/data/ServusShowRefreshSchedulePolicyTest.kt
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'perf(servustv): isolate refresh sections and throttle selected-show queries'
          git push origin HEAD:fix/servustv-progressive-refresh

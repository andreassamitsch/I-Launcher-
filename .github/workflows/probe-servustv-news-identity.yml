name: Probe ServusTV news identity
on:
  push:
    branches: [probe/servustv-news-logo-identity]
    paths: [.github/workflows/probe-servustv-news-identity.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe search and show collections
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.parse, urllib.request
          HEADERS={
            'User-Agent':'Mozilla/5.0 (Windows NT 10.0; WOW64; rv:153.0) Gecko/20100101 Firefox/153.0',
            'Accept':'application/json, text/plain, */*',
            'Accept-Language':'de-DE,de;q=0.9,en;q=0.8',
            'Origin':'https://www.servustv.com',
            'Referer':'https://www.servustv.com/'
          }
          def get(url):
            req=urllib.request.Request(url, headers=HEADERS)
            with urllib.request.urlopen(req, timeout=20) as r: return json.load(r)
          def brief(card):
            return {k:card.get(k) for k in ('id','type','content_type','title','show_name','duration','playable','collections')}

          show_ids=['AA-1Y5RJCD1H2111','AAYGF2URW6ALQYE42IJK']
          for show_id in show_ids:
            product=get(f'https://tv-api.redbull.com/products/v5.3/stv/de/at/{show_id}')
            print('\nSHOW',show_id,product.get('title'))
            print('SHOW_RESOURCES',json.dumps(product.get('media_resources'),ensure_ascii=False))
            for ref in product.get('collections') or []:
              cid=ref.get('id')
              if not cid: continue
              try:
                collection=get(f'https://tv-api.redbull.com/collections/v5.3/stv/de/at/{cid}?offset=0')
              except Exception as exc:
                print('COLLECTION_ERROR',cid,repr(exc)); continue
              print('COLLECTION',cid,'label=',collection.get('label'),'list_type=',collection.get('list_type'))
              cards=collection.get('cards') or []
              print(json.dumps([brief(x) for x in cards[:40]],ensure_ascii=False,indent=2))

          for episode_id in ['AAS7HKP8NZLHXLY5SJHM']:
            p=get(f'https://tv-api.redbull.com/products/v5.3/stv/de/at/{episode_id}')
            print('\nEPISODE_PRODUCT',episode_id)
            print(json.dumps(brief(p),ensure_ascii=False,indent=2))
          PY

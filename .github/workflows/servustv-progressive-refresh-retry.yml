name: ServusTV progressive refresh checked update

on:
  push:
    branches: [fix/servustv-progressive-refresh]
    paths: ['.github/workflows/servustv-progressive-refresh-retry.yml']

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/servustv-progressive-refresh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Apply original exact-match patch to checked-out sources
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          workflow = Path('.github/workflows/servustv-progressive-refresh.yml').read_text()
          start = workflow.index("          python3 - <<'PY'\n") + len("          python3 - <<'PY'\n")
          end = workflow.index('\n          PY', start)
          original_script = dedent(workflow[start:end])
          exec(compile(original_script, 'servustv-progressive-refresh-patch', 'exec'))
          PY
      - name: Build and test both Android modules
        run: gradle :servustv-provider:testDebugUnitTest :servustv-provider:assembleDebug :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Commit only tested production change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/servustv-progressive-refresh.yml .github/workflows/servustv-progressive-refresh-retry.yml
          git add servustv-provider/src/main/java/com/andreassamitsch/servusprovider/ui/MainActivity.kt
          git commit -m 'fix(servustv): show saved content before full refresh completes'
          git push origin HEAD:fix/servustv-progressive-refresh

name: Apply Joyn AT Watch Next artwork repair
on:
  push:
    paths:
      - .github/workflows/apply-joyn-at-watchnext-artwork-20260920.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/joyn-tv-client
          persist-credentials: true
      - name: Validate and apply episode-specific metadata changes
        shell: bash
        run: |
          python3 -m py_compile scripts/apply_joyn_at_watchnext_artwork_20260920.py
          python3 scripts/apply_joyn_at_watchnext_artwork_20260920.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('joyntv/src/main/java/com/andreassamitsch/joyntv/JoynRepository.kt')
          s = p.read_text()
          s = s.replace('id = candidate.seriesId ?: path,', 'id = candidate?.seriesId ?: path,')
          s = s.replace('title = candidate.seriesTitle ?: entry.media.seriesTitle ?: entry.media.title,', 'title = candidate?.seriesTitle ?: entry.media.seriesTitle ?: entry.media.title,')
          p.write_text(s)
          PY
          git diff --check
      - name: Commit implemented changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-joyn-at-watchnext-artwork-20260920.yml scripts/apply_joyn_at_watchnext_artwork_20260920.py
          git add joyntv/src/main/java/com/andreassamitsch/joyntv/ app/src/main/java/com/andreassamitsch/ilauncher/ joyntv/src/test/java/com/andreassamitsch/joyntv/JoynExactEpisodeMetadataTest.kt app/src/test/java/com/andreassamitsch/ilauncher/data/tv/JoynWatchNextSourceMetadataTest.kt docs/JOYNTV_CURRENT_STATE.md
          git diff --cached --check
          git commit -m 'fix: preserve Austrian Joyn episode images logo and synopsis in Watch Next'
          git push origin HEAD:feature/joyn-tv-client
name: Run ServusTV channel selection sync fix

on:
  push:
    branches:
      - feat/servustv-news-provider-prototype
    paths:
      - .github/workflows/fix-servustv-channel-selection-sync-runner.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/servustv-news-provider-prototype
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Extract and apply fix
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import subprocess

          workflow = Path('.github/workflows/fix-servustv-channel-selection-sync.yml').read_text()
          start_marker = "          python3 <<'PY'\n"
          end_marker = "\n          PY\n\n      - name: Test and build"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          embedded = workflow[start:end]
          output = []
          in_triple = False
          for line in embedded.splitlines():
              if not in_triple and line.startswith('          '):
                  line = line[10:]
              output.append(line)
              if line.count("'''") % 2 == 1:
                  in_triple = not in_triple
          Path('/tmp/fix_servustv_sync.py').write_text('\n'.join(output) + '\n')
          subprocess.run(['python3', '/tmp/fix_servustv_sync.py'], check=True)
          PY

      - name: Test and build
        run: gradle :servustv-provider:testDebugUnitTest :servustv-provider:assembleDebug --stacktrace

      - name: Commit tested fix
        shell: bash
        run: |
          rm .github/workflows/fix-servustv-channel-selection-sync.yml
          rm .github/workflows/fix-servustv-channel-selection-sync-runner.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(servustv): sync show channel selection changes"
          git push origin HEAD:feat/servustv-news-provider-prototype
